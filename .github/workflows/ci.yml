name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: d7z-project/cache-proxy

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build binary
        run: CGO_ENABLED=0 go build -v -o cache-proxy .

      - name: Run tests
        run: make test

      - name: Run race tests
        run: make test-race

      - name: Run fuzz smoke tests
        run: make test-fuzz

      - name: Vet
        run: make vet

  e2e-docker:
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        mode:
          - file
          - npm
          - go
          - maven
          - cargo
          - pypi
          - deb
          - apk
          - rpm
          - pacman
          - git
          - oci
          - flatpak

    steps:
      - uses: actions/checkout@v4

      - name: Run ${{ matrix.mode }} end-to-end case
        env:
          E2E_RUNTIME: docker
          E2E_SUITE: ${{ matrix.mode }}
        run: make test-e2e

  e2e-podman:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    needs: build-and-test
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install Podman
        run: sudo apt-get update && sudo apt-get install -y podman

      - name: Run Podman smoke suite
        env:
          E2E_RUNTIME: podman
          E2E_SUITE: file
        run: make test-e2e

  docker:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-and-test, e2e-docker]
    permissions:
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
